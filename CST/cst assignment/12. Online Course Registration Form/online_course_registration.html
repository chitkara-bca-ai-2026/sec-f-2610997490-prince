<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Course Registration</title>
</head>
<body>
  <h1>Online Course Registration</h1>

  <form action="#" method="post" target="_self" enctype="multipart/form-data">
    <p>
      <label for="studentName">Student Name:</label>
      <input type="text" id="studentName" name="studentName" placeholder="Enter your full name" required>
    </p>

    <p>
      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" placeholder="name@example.com" required>
    </p>

    <p>
      <label for="mobile">Mobile Number:</label>
      <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" required>
    </p>

    <p>
      <label for="age">Age:</label>
      <input type="number" id="age" name="age" min="1" max="120" placeholder="Enter your age">
    </p>

    <p>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" placeholder="Create a password" required>
    </p>

    <fieldset>
      <legend>Gender:</legend>
      <label><input type="radio" name="gender" value="Male" required> Male</label>
      <label><input type="radio" name="gender" value="Female"> Female</label>
      <label><input type="radio" name="gender" value="Other"> Other</label>
    </fieldset>

    <fieldset>
      <legend>Skills (select all that apply):</legend>
      <label><input type="checkbox" name="skills" value="HTML"> HTML</label>
      <label><input type="checkbox" name="skills" value="CSS"> CSS</label>
      <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
      <label><input type="checkbox" name="skills" value="Python"> Python</label>
    </fieldset>

    <p>
      <label for="course">Choose a Course:</label>
      <select id="course" name="course" required>
        <option value="">-- Select a course --</option>
        <option value="Web Development">Web Development</option>
        <option value="Python Programming">Python Programming</option>
        <option value="Data Analytics">Data Analytics</option>
        <option value="Digital Marketing">Digital Marketing</option>
      </select>
    </p>

    <input type="hidden" name="formTitle" value="Online Course Registration">

    <p>
      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob">
    </p>

    <p>
      <label for="classTime">Preferred Class Time:</label>
      <input type="time" id="classTime" name="classTime">
    </p>

    <p>
      <label for="additionalInfo">Address / Additional Information:</label><br>
      <textarea id="additionalInfo" name="additionalInfo" rows="4" cols="40" placeholder="Enter your address or any additional details"></textarea>
    </p>

    <p>
      <label for="document">Upload Supporting Document:</label>
      <input type="file" id="document" name="document">
    </p>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
  </form>
</body>
</html>
